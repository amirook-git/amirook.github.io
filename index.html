<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amirhosein | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b1020; --panel:#111a30; --line:#27345a; --text:#dbe4f5; --muted:#8a98b8; --accent:#ffc857;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:16px;line-height:1.65;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-position:-14px -14px;
  display:flex;justify-content:center;align-items:center;padding:24px 16px;
}
main{width:100%;max-width:640px}
.term{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line)}
.bar i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.body{padding:28px 24px 32px}
.prompt{color:var(--muted);margin:0 0 6px}
.prompt b{color:var(--accent);font-weight:600}
.typed{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;
  width:0;animation:type .9s steps(6) .3s forwards;color:var(--text)}
@keyframes type{to{width:6ch}}
h1{font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.05;font-weight:800;margin:14px 0 10px;letter-spacing:-.02em}
.cursor{display:inline-block;width:.55em;height:.9em;background:var(--accent);margin-left:6px;vertical-align:-.08em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.role{color:var(--muted);margin:0 0 30px;max-width:46ch}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.link{
  display:flex;align-items:center;gap:14px;padding:13px 16px;text-decoration:none;color:var(--text);
  border:1px solid var(--line);border-radius:6px;background:transparent;
  transition:background .15s,border-color .15s,color .15s;
}
a.link .cmd{color:var(--accent);font-weight:600;min-width:9ch}
a.link .dest{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.link:hover{background:var(--accent);border-color:var(--accent);color:var(--bg)}
a.link:hover .cmd,a.link:hover .dest{color:var(--bg)}
a.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:480px){a.link{flex-direction:column;align-items:flex-start;gap:2px}}
@media (prefers-reduced-motion:reduce){
  .typed{animation:none;width:6ch}
  .cursor{animation:none}
}
</style>
</head>
<body>
<main>
  <div class="term">
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="body">
      <p class="prompt"><b>~</b> $ <span class="typed">whoami</span></p>
      <h1>Amirhosein<span class="cursor" aria-hidden="true"></span></h1>
      <p class="role">Mechanical Engineering student trying to find his path. Always learning and looking for opportunities.</p>
      <ul>
        <li><a class="link" href="https://t.me/beastsaed" target="_blank" rel="noopener"><span class="cmd">telegram</span><span class="dest">t.me/beastsaed</span></a></li>
        <li><a class="link" href="https://github.com/your-handle" target="_blank" rel="noopener"><span class="cmd">github</span><span class="dest">github.com/your-handle</span></a></li>
        <li><a class="link" href="https://www.linkedin.com/in/your-handle" target="_blank" rel="noopener"><span class="cmd">linkedin</span><span class="dest">linkedin.com/in/your-handle</span></a></li>
        <li><a class="link" href="https://example.com" target="_blank" rel="noopener"><span class="cmd">website</span><span class="dest">example.com</span></a></li>
      </ul>
    </div>
  </div>
</main>
</body>
</html>
